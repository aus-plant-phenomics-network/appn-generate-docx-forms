    control: text
    label: "Institutional Biosafety Committee Approval letter"
    
  - type: section
    text: "C"
    background: "#90A4AE"
    
  - type: field
    name: geneticallyModified_NLRD_C
    control: checkboxList
    items: ["C"]
    label: |
      [C] The Plant Accelerator (Cert.3062, 4882 and 3790) was not originally listed in our NLRD.
      I have attached a copy of 
      a) The approval of our NLRD with the OGTR identifier on it, 
      and
      b) A letter stating that we have sought and gained approval from our Institutional Biosafety Committee (IBC) to have Cert.3062/2010 and 3790/2014 added to our existing NLRD.

