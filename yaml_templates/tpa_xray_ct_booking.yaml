  - type: section
    text: |
      11. Plants/Seeds Genetic Modification
      Terminology: 
      Office of the Gene Technology Regulator (OGTR)
      Notifiable Low Risk Dealings (NLRD)
    background: "#558B2F"
    
  - type: field
    name: geneticallyModified_Modified
    control: checkboxList
    items: ["Yes", "No"]
    label:  "Are the plants or seeds gentically modified?"
    
  - type: section
    text: "Please choose your between A, B or C as described below:"
    background: "#90A4AE"
  - type: section
    text: "A"
    background: "#90A4AE"
    
  - type: field
    name: geneticallyModified_NLRD_A
    control: checkboxList
    items: ["A"]
    label: |
      [A] Our NLRD includes The Plant Accelerator (Cert.3062, 4882 and 3790) as a facility and I have attached a copy for your records.

  - type: field
    name: geneticallyModified_NLRD_A_Id
    control: text
    label:  "OGTR Id"
  - type: field
    name: geneticallyModified_NLRD_A_approval_letter
    control: text
    label: "NLRD letter name"

  - type: section
    text: "B"
    background: "#90A4AE"
    
  - type: field
    name: geneticallyModified_NLRD_B
    control: checkboxList
    items: ["B"]
    label: |
      [B] The Plant Accelerator (Cert.3062, 4882 and 3790) was not originally listed as an approved facility in our NLRD.
      I have attached a copy of 
      a) our NLRD, 
      and 
      b) A letter stating that we have sought and gained approval from our Institutional Biosafety Committee (IBC) to have Cert.3062, 4882 and 3790 added to our existing NLRD.

  - type: field
    name: geneticallyModified_NLRD_B_Id
    control: text
    label:  "OGTR Id"
  - type: field
    name: geneticallyModified_NLRD_B_approval_letter
    control: text
    label: "NLRD letter name:"
  - type: field
