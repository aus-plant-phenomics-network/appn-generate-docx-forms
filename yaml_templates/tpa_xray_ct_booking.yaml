  For questions about X-ray CT hire at The Plant Accelerator® please contact:
   •	 Bettina Berger    on 08 8313 0825 regarding project design
   •	 Haoyu Lou         on 08 8313 0345 regarding project design
   •	 David Field       on 08 8313 4853 regarding pricing and availability
